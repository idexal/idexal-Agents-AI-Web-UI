# GitHub Release — idexla Agents AI Web UI — Free OpenSource
# Creates a GitHub Release (and optional Packages) when a version tag is pushed.
# Tags: v* (e.g. v0.1.3, v1.0.0). Uses official logo from .github/assets/logo.png.
name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

      - name: Generate release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cat > /tmp/release-notes.md <<'EOF'
          <p align="center">
            <img src="https://raw.githubusercontent.com/idexal/agents/main/.github/assets/logo.png" alt="idexla Agents" width="140" />
          </p>

          # idexla Agents AI Web UI — Free OpenSource

          **Tag:** `__TAG__` • **License:** MIT • **By:** [Zakariae Lahbabi](https://zakariaelahbabi.com) / [Idexal](https://idexal.com)

          > Free OpenSource AI-powered IDE. Everything-is-a-plugin • Built on Cordis • 100% Free Forever.

          ## ✨ Highlights
          - 🆓 **Free forever** — MIT licensed, no paywall, no feature gating
          - 🧩 **Everything is a plugin** (Cordis `ctx.effect()` / `ctx.on()`)
          - 🤖 **Multi-provider AI** — bring your own keys, gateways, or local models
          - 🌐 **Web UI + Desktop + CLI** — same harness, same memory
          - ⚡ **Blazing fast** — Rust engine, Monaco Editor
          - 🌍 **i18n** — English, 中文, العربية

          ## 📦 Install

          ```sh
          npx @deepseek-ai/dsh web
          # or from source
          git clone https://github.com/idexal/agents.git
          cd agents && pnpm install && pnpm run build && pnpm dsh web
          ```

          Opens `http://127.0.0.1:3080` by default. See [docs](https://agents.idexal.com) and [SUPPORT.md](https://github.com/idexal/agents/blob/main/SUPPORT.md).

          ## 💖 Keep it Free Forever

          This project stays MIT and free only with your support:

          - ⭐ **Star** this repo
          - 💖 **Sponsor:** [github.com/sponsors/idexal](https://github.com/sponsors/idexal) • [ko-fi.com/idexal](https://ko-fi.com/idexal) • [info@idexal.com](mailto:info@idexal.com)
          - 🤝 **Contribute:** [CONTRIBUTING.md](https://github.com/idexal/agents/blob/main/CONTRIBUTING.md)
          - 📣 **Share** `idexal-plugin` topic for your plugins

          Every sponsorship, star, and PR directly funds development and keeps this free for students, indie hackers, and enterprises worldwide.

          ## 📚 Links

          - **Docs:** [agents.idexal.com](https://agents.idexal.com)
          - **Issues:** [github.com/idexal/agents/issues](https://github.com/idexal/agents/issues)
          - **Discussions:** [github.com/idexal/agents/discussions](https://github.com/idexal/agents/discussions)
          - **Website:** [idexal.com](https://idexal.com) • Contact: [team@idexal.com](mailto:team@idexal.com)

          ---

          <p align="center"><strong>idexla Agents AI Web UI</strong> — Free OpenSource, Forever<br/>Built with ❤️ by <a href="https://idexal.com">Idexal</a> • <a href="https://zakariaelahbabi.com">Zakariae Lahbabi</a></p>
          EOF
          sed -i "s/__TAG__/${TAG}/g" /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: idexla Agents AI Web UI — ${{ steps.tag.outputs.tag }} — Free OpenSource
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-rc') }}
          generate_release_notes: true
          files: |
            .github/assets/logo.png
            .github/assets/icon.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
